name: Lyrics transcription probe
# Diagnostic: compares Whisper set-ups on selected songs. Run it from the Actions tab (or
# gh workflow run lyrics-probe.yml --ref ci/fma-sample-test, which reuses that branch's model cache).
on:
  workflow_dispatch:
env:
  PYTHON_VERSION: "3.13"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  TF_CPP_MIN_LOG_LEVEL: "2"
defaults:
  run:
    shell: bash
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: ci/requirements-ci.txt}
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            .cache/huggingface
            .cache/torch
            models/essentia
          key: songfeatures-models-${{ hashFiles('ci/config_ci.yaml', 'songfeatures/features/essentia_models.py') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: bash ci/install.sh && python -m songfeatures download-models --config ci/config_ci.yaml
  probe:
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ids:
          - "fma_113809 fma_029261"
          - "fma_058213 fma_011669"
          - "fma_011697 fma_011648"
          - "fma_121549 fma_058138"
          - "fma_016396 fma_029262"
          - "fma_029243 fma_019125"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: ci/requirements-ci.txt}
      - uses: actions/cache/restore@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
            models/essentia
          key: songfeatures-models-${{ hashFiles('ci/config_ci.yaml', 'songfeatures/features/essentia_models.py') }}
          fail-on-cache-miss: true
      - run: bash ci/install.sh
      - name: Download songs
        run: |
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv("ci/fma_sample/manifest.csv")
          m[m.track_id.isin("${{ matrix.ids }}".split())].to_csv("probe_manifest.csv", index=False)
          PY
          python ci/fetch_fma_sample.py --manifest probe_manifest.csv
      - name: Probe
        run: python ci/lyrics_probe.py --manifest probe_manifest.csv --config ci/config_ci.yaml --out probe ${{ matrix.ids }} 2>&1 | grep -v -E "TensorflowPredict|dso_loader|cuda"
      - id: name
        run: echo "n=$(echo '${{ matrix.ids }}' | tr ' ' '_')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: probe-${{ steps.name.outputs.n }}
          path: |
            probe/*.csv
            probe/*.txt
