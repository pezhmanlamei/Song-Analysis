name: Debug one shard
on:
  workflow_dispatch:
  push:
    branches: [ci/debug-shard]
env:
  PYTHON_VERSION: "3.13"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  TF_CPP_MIN_LOG_LEVEL: "2"
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            .cache/huggingface
            .cache/torch
            models/essentia
          key: songfeatures-models-${{ hashFiles('ci/config_ci.yaml', 'songfeatures/features/essentia_models.py') }}
      - run: bash ci/install.sh
      - if: steps.models.outputs.cache-hit != 'true'
        run: python -m songfeatures download-models --config ci/config_ci.yaml
      - run: python ci/fetch_fma_sample.py --manifest ci/fma_sample/manifest.csv --shard 16/20
      - name: Machine
        run: nproc; free -m; lscpu | grep -E "Model name|Flags" | cut -c1-300
      - name: Each core module alone, one song, one process
        run: |
          (while true; do free -m | awk '/Mem:/{print strftime("%T"), $3}' >> mem.log; sleep 1; done) &
          for m in loudness timbre rhythm harmony structure; do
            echo "=== $m"
            /usr/bin/time -v python -X faulthandler -m songfeatures run --manifest ci/fma_sample/manifest.csv \
              --out res_$m --config ci/config_ci.yaml --workers 1 --shard 16/20 --modules $m 2>&1 \
              | grep -E -v "TensorflowPredict|dso_loader" | tail -40 || true
          done
          sort -k2 -n mem.log | tail -1
      - name: Kernel log
        if: always()
        run: sudo dmesg | tail -30 || true
