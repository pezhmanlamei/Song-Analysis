name: Debug one shard
on:
  workflow_dispatch:
  push:
    branches: [ci/debug-shard]
env:
  PYTHON_VERSION: "3.13"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch
  TF_CPP_MIN_LOG_LEVEL: "2"
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ci/requirements-ci.txt
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            .cache/huggingface
            .cache/torch
            models/essentia
          key: songfeatures-models-${{ hashFiles('ci/config_ci.yaml', 'songfeatures/features/essentia_models.py') }}
      - run: bash ci/install.sh
      - if: steps.models.outputs.cache-hit != 'true'
        run: python -m songfeatures download-models --config ci/config_ci.yaml
      - run: python ci/fetch_fma_sample.py --manifest ci/fma_sample/manifest.csv --shard 16/20
      - name: Machine
        run: nproc; free -m; lscpu | grep -E "Model name|Flags" | cut -c1-300
      - name: All core modules in a pool (4 workers, then 2)
        run: |
          (while true; do free -m | awk '/Mem:/{print strftime("%T"), $3}' >> mem.log; sleep 1; done) &
          for w in 4; do
            echo "=== workers $w"; : > mem.log
            python -X faulthandler -m songfeatures run --manifest ci/fma_sample/manifest.csv \
              --out res_w$w --config ci/config_ci.yaml --workers $w --shard 16/20 \
              --modules loudness,timbre,rhythm,harmony,structure 2>&1 \
              | grep -E -v "TensorflowPredict|dso_loader|it/s\]" | tail -60 || true
            echo "peak used MB with $w workers: $(sort -k2 -n mem.log | tail -1)"
          done
      - name: Kernel log
        if: always()
        run: sudo dmesg -T | grep -i -E "oom|killed|segfault|trap" | tail -20 || true
