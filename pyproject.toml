[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "songfeatures"
version = "0.1.0"
description = "Open-source audio feature pipeline for full-length songs (research use)"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "librosa>=0.10", "soundfile>=0.12", "pyloudnorm>=0.1.1",
                "scikit-learn>=1.3", "pandas>=2.0", "pyyaml>=6.0", "tqdm>=4.0", "opensmile>=2.5",
                "vaderSentiment>=3.3"]

[project.optional-dependencies]
essentia = ["essentia-tensorflow"]
models = ["torch>=2.1", "torchaudio>=2.1", "demucs>=4.0.1", "faster-whisper>=1.0", "transformers>=4.40"]

[project.scripts]
songfeatures = "songfeatures.__main__:main"

[tool.setuptools.packages.find]
include = ["songfeatures*"]
